{% extends "registros/base.html" %}
{% block titulo %}Eliminar visita{% endblock %}
{% block contenido %}<section class="contenedor"><h2>Confirmar eliminación</h2>
  <p>¿Eliminar la visita de <strong>{{ visita.nombre }}</strong> ({{ visita.rut }})? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}<button type="submit" class="boton peligro">Sí, eliminar</button> <a class="boton secundario" href="{% url 'registro' %}">Cancelar</a></form>
</section>{% endblock %}
